<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b0a3ce" />
    <script>
      // Apply the saved Appearance setting before first paint, so dark mode doesn't flash light.
      // Mirrors applyTheme() in src/lib/theme.svelte.ts; colors are THEME_COLORS in src/lib/theme.ts.
      try {
        var theme = JSON.parse(localStorage.getItem('theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1c1529' : '#b0a3ce';
      } catch (e) {}
    </script>
    <meta name="description" content="Offline flashcards for learning anything" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flashcards" />
    <link rel="icon" href="/flashcards-pwa/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/flashcards-pwa/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/flashcards-pwa/apple-touch-icon-180x180.png" />
    <title>Flashcards</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
