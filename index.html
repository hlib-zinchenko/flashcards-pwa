<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Only this site's own files run, and nothing is sent anywhere else. The hash is the theme script below:
         change that script and tests/csp.test.ts prints the new hash. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-5IJnwLaTZnOY4fUFlLAkMPvMC1Jo4H16uNGE/XO7cOA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b0a3ce" />
    <script>
      // Apply the saved Appearance setting before first paint, so dark mode doesn't flash light.
      // Mirrors applyTheme() in src/lib/theme.svelte.ts; colors are THEME_COLORS in src/lib/theme.ts.
      try {
        var theme = JSON.parse(localStorage.getItem('theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1c1529' : '#b0a3ce';
      } catch (e) {}
    </script>
    <title>Karbka: carve it into memory. Offline flashcards for your phone</title>
    <meta name="description" content="Karbka is a flashcard app for your phone: carve it into memory. Make decks and learn them with quick swipe tests. Works offline and installs to your home screen. No account: your cards stay on your device." />
    <link rel="canonical" href="https://app.karbka.com/" />

    <meta property="og:locale:alternate" content="uk_UA" />
