<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Only this site's own files run, and nothing is sent anywhere else. The hash is the theme script below:
         change that script and tests/csp.test.ts prints the new hash. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-5IJnwLaTZnOY4fUFlLAkMPvMC1Jo4H16uNGE/XO7cOA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://2b2tarw2mpxzk6bok5r77wyvpe0xnnpa.lambda-url.eu-north-1.on.aws; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b0a3ce" />
    <script>
      // Apply the saved Appearance setting before first paint, so dark mode doesn't flash light.
      // Mirrors applyTheme() in src/lib/theme.svelte.ts; colors are THEME_COLORS in src/lib/theme.ts.
      try {
        var theme = JSON.parse(localStorage.getItem('theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1c1529' : '#b0a3ce';
      } catch (e) {}
    </script>
    <!-- This is the app itself; karbka.com is the page about it, so the words here point there. -->
    <title>Karbka app: open your flashcards</title>
    <meta name="description" content="The Karbka flashcard app. Make decks, study them with swipe tests, and install it on your phone, tablet or computer. Free, works offline, no account. What it is and how to install it: karbka.com." />
    <link rel="canonical" href="https://app.karbka.com/" />
    <!-- Sharing previews. Absolute URLs: update them if the domain changes. -->

    <meta property="og:site_name" content="Karbka" />
    <meta property="og:title" content="Karbka app: open your flashcards" />

    <meta property="og:image" content="https://app.karbka.com/og-image.png" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Karbka flashcards app: a fanned stack of cards, the top one reading 好き" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
